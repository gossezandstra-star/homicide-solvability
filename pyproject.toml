[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homicide-solvability"
version = "1.0.0"
description = "Predicting unsolved homicides and detecting serial-offender patterns (61.501 Production Ready ML)"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
